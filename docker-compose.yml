version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: yourpad-postgres
    environment:
      POSTGRES_USER: yourpad
      POSTGRES_PASSWORD: yourpadpassword
      POSTGRES_DB: yourpad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yourpad-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yourpad-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yourpad:yourpadpassword@postgres:5432/yourpad
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_DIR=/storage
    volumes:
      - ./storage:/storage
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yourpad-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
